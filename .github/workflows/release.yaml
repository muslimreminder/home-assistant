name: Release

# A tag v1.2.3 publishes a GitHub release, which HACS offers as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version of the manifest
        run: |
          version=$(jq -r .version custom_components/muslim_reminder/manifest.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "manifest.json says $version, the tag $GITHUB_REF_NAME"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
